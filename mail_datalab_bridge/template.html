<!doctype html>
<html>
        <head>
            <style>
                pre { margin: 0; }
                .codehilite {
                    padding: 10px;
                    border-radius: 3px;
                    margin: 10px 0;
                    overflow-x: auto;
                }
                .math {
                    font-family: "Cambria Math", "Times New Roman", serif;
                    background-color: #fdf6e3;
                    padding: 2px 4px;
                    border-radius: 3px;
                    font-style: italic;
                    display: inline-block;
                }
                div.math {
                    display: block;
                    margin: 10px 0;
                }
            </style>
        </head>
        <body style="font-family: Calibri, sans-serif; margin: 0; padding: 0;">
            <span style="display:none; font-size:0; color:transparent;">mail-bridge:{request_id}</span>
            <div style="background: #21A038; color: white; padding: 15px;">
                <h1 style="margin: 0;">AI ОАОФР</h1>
            </div>

            
            <div style="padding: 20px; background: #F3F2F1; margin: 10px; border-radius: 5px;">
                <h2 style="color: #21A038;">Вопрос:</h2>
                <p style="font-size: 16px;">{question}</p>
            </div>

            <div style="padding: 20px; margin: 10px;">
                <h2 style="color: #21A038; border-bottom: 2px solid #21A038; padding-bottom: 5px;">
                    Ответ
                </h2>
                {answers_html}
            </div>
        </body>
</html>
